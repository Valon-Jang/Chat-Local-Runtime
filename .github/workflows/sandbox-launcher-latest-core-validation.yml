name: sandbox-launcher-latest-core-validation

on:
  push:
    branches: [main]
    paths:
      - 'dist/active/**'
      - 'dist/sandboxlauncher.pyz.b64'
      - '.github/workflows/sandbox-launcher-latest-core-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize candidate and report hashes
        shell: bash
        run: |
          set -euo pipefail
          base64 -d dist/sandboxlauncher.pyz.b64 > sandboxlauncher.pyz
          cat dist/artifactbuilder.pyz.part01 dist/artifactbuilder.pyz.part02 dist/artifactbuilder.pyz.part03 dist/artifactbuilder.pyz.part04 dist/artifactbuilder.pyz.part05 > artifactbuilder.pyz
          echo '--- observed active hashes ---'
          sha256sum dist/active/*.pyz sandboxlauncher.pyz artifactbuilder.pyz
          echo '--- recorded active hashes ---'
          cat dist/active/SHA256SUMS.txt
          echo '5e8f1b73ec0bb2628bae74e449dc624fbc744c351ce15a21aa2ff4e5c22a4d85  sandboxlauncher.pyz' | sha256sum -c -
          echo '1677f84252d0e275f0448426ac6702318ad30589c462493aea533e1ddfe63c3a  artifactbuilder.pyz' | sha256sum -c -
      - name: Active core self-tests and interfaces
        shell: bash
        run: |
          set -euo pipefail
          for f in dist/active/workerhub-0.1.1.pyz dist/active/verificationrunner-0.2.0.pyz dist/active/workspaceinspector-0.1.3.pyz dist/active/smartdiff-0.1.1.pyz; do
            echo "===== $f capabilities ====="
            python "$f" capabilities
            echo "===== $f self-test ====="
            python "$f" self-test
            echo "===== $f help ====="
            python "$f" --help || true
          done
          echo '===== artifact builder self-test ====='
          python artifactbuilder.pyz self-test
          echo '===== sandbox launcher self-test ====='
          python sandboxlauncher.pyz self-test
          echo '===== sandbox help ====='
          python sandboxlauncher.pyz --help
      - name: Hub real plugin invocation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"plugin","plugin":"./sandboxlauncher.pyz","request":{"command":["/bin/true"]},"timeout":60}' | python dist/active/workerhub-0.1.1.pyz request - | tee hub-result.json
          python - <<'PY'
          import json
          x=json.load(open('hub-result.json'))
          assert x['status']=='SUCCESS', x
          r=x['result']
          assert r['status']=='PASS' and r['strong'] is True and r['backend']=='linux_chroot_seccomp', x
          PY
      - name: Extract exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate baseline
          python - <<'PY'
          import zipfile, pathlib, shutil
          with zipfile.ZipFile('sandboxlauncher.pyz') as z:
              data=z.read('__main__.py')
          pathlib.Path('candidate/sandbox_launcher.py').write_bytes(data)
          pathlib.Path('candidate/SandboxLauncher-v0.1.1.pyz').write_bytes(pathlib.Path('sandboxlauncher.pyz').read_bytes())
          shutil.copy2('candidate/sandbox_launcher.py','baseline/sandbox_launcher.py')
          PY
      - name: Inspector latest-core pass
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"inspect","inputs":["candidate"],"cache_path":"inspector-cache.json"}' | python dist/active/workspaceinspector-0.1.3.pyz request - | tee inspector.json
          printf '%s' '{"operation":"targeted-content","inputs":["candidate"],"content_paths":["input0/sandbox_launcher.py"]}' | python dist/active/workspaceinspector-0.1.3.pyz request - | tee inspector-targeted.json
      - name: Smart Diff latest-core baseline check
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"operation":"compare","before":"baseline","after":"candidate"}' | python dist/active/smartdiff-0.1.1.pyz request - | tee smartdiff.json
      - name: Verification Runner interface discovery
        shell: bash
        run: |
          set -euo pipefail
          python dist/active/verificationrunner-0.2.0.pyz verify --help | tee verifier-help.txt
      - name: Reciprocal sandbox dogfood current core
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'workerhub:dist/active/workerhub-0.1.1.pyz:self-test' \
            'verificationrunner:dist/active/verificationrunner-0.2.0.pyz:self-test' \
            'workspaceinspector:dist/active/workspaceinspector-0.1.3.pyz:self-test' \
            'smartdiff:dist/active/smartdiff-0.1.1.pyz:self-test' \
            'artifactbuilder:artifactbuilder.pyz:self-test'; do
            IFS=: read -r name path arg <<< "$spec"
            python - "$name" "$path" "$arg" <<'PY'
          import json, subprocess, sys
          name,path,arg=sys.argv[1:]
          req={"command":[sys.executable,path,arg],"timeout":180}
          cp=subprocess.run([sys.executable,'sandboxlauncher.pyz','request','-'],input=json.dumps(req),text=True,capture_output=True,check=False)
          print(cp.stdout)
          assert cp.returncode==0, (name,cp.stderr,cp.stdout)
          outer=json.loads(cp.stdout)
          assert outer['status']=='PASS' and outer['strong'] is True, (name,outer)
          inner=json.loads(outer['stdout'])
          assert inner['status']=='PASS', (name,inner)
          PY
          done
